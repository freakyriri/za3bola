
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050308;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

#fade {
    position: absolute;
    inset: 0;
    background: #050308;
    opacity: 0;
    pointer-events: none;
}

#message {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 850px;
    text-align: center;
    color: #ffd0e6;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(30px, 6vw, 58px);
    font-weight: 600;
    font-style: italic;
    line-height: 1.3;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 2s ease, transform 2s ease;
    text-shadow: 0 0 15px #ff69b4,
                 0 0 35px #e75480;
}

#message.show {
    opacity: 1;
    transform: translateY(0);
}

#heart {
    transition: opacity 1.8s ease;
}

#fade.show {
    opacity: 1;
    transition: opacity 1.8s ease;
}

</style>
</head>

<body>

<canvas id="heart"></canvas>

<div id="fade"></div>

<div id="message">
    you're so far away and yet,<br>
    closer to my heart than anyone else
    <div style="font-size:35px; margin-top:20px;">♡</div>
</div>

<script>

const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

let W, H, unit, cx, cy;
let particles = [];
let drawn = 0;

const drawDuration = 7500;
const holdDuration = 1200;
const fadeDuration = 1800;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    unit = Math.min(W / 570, H / 570);
    cx = W / 2;
    cy = H / 2 - 10 * unit;
}

function heart(a, scale) {
    const x = 16 * Math.pow(Math.sin(a), 3);

    const y = 13 * Math.cos(a)
        - 5 * Math.cos(2 * a)
        - 2 * Math.cos(3 * a)
        - Math.cos(4 * a);

    return {
        x: cx + x * scale * unit,
        y: cy - y * scale * unit
    };
}

function makeParticle(scaleMin, scaleMax, lenMin, lenMax) {

    const a = Math.random() * Math.PI * 2;
    const scale = scaleMin +
        Math.random() * (scaleMax - scaleMin);

    const pos = heart(a, scale);

    const angle = Math.atan2(
        pos.y - cy,
        pos.x - cx
    ) + (Math.random() - 0.5);

    const length = (
        lenMin + Math.random() * (lenMax - lenMin)
    ) * unit;

    return {
        x: pos.x,
        y: pos.y,
        ex: pos.x + Math.cos(angle) * length,
        ey: pos.y + Math.sin(angle) * length,
        color: Math.random(),
        width: 0.5 + Math.random() * 1.2,
        delay: Math.random() * drawDuration
    };
}

function createParticles() {

    particles = [];
    drawn = 0;

    for (let i = 0; i < 6500; i++) {
        particles.push(makeParticle(0.5, 15.5, 1, 5));
    }

    for (let i = 0; i < 2200; i++) {
        particles.push(makeParticle(15, 16.2, 3, 12));
    }

    particles.sort((a, b) => a.delay - b.delay);
}

function drawParticle(p) {

    const pink = Math.floor(100 + p.color * 120);

    ctx.beginPath();

    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.ex, p.ey);

    ctx.strokeStyle = `rgb(255, ${pink}, ${Math.min(255, pink + 25)})`;
    ctx.lineWidth = p.width * unit;

    ctx.shadowBlur = 8 * unit;
    ctx.shadowColor = "#ff1493";

    ctx.stroke();

    ctx.shadowBlur = 0;
}

function animate(now) {

    const elapsed = now - startTime;

    while (
        drawn < particles.length &&
        particles[drawn].delay <= elapsed
    ) {
        drawParticle(particles[drawn]);
        drawn++;
    }

    const fadeStart = drawDuration + holdDuration;

    if (elapsed >= fadeStart) {
        document.getElementById("fade")
            .classList.add("show");
    }

    if (elapsed >= fadeStart + fadeDuration) {
        document.getElementById("message")
            .classList.add("show");
        return;
    }

    requestAnimationFrame(animate);
}

resize();
createParticles();

let startTime = performance.now();

requestAnimationFrame(animate);

window.addEventListener("resize", () => {
    resize();
    createParticles();
    startTime = performance.now();
    document.getElementById("fade").classList.remove("show");
    document.getElementById("message").classList.remove("show");
    requestAnimationFrame(animate);
});

</script>

</body>
</html>
